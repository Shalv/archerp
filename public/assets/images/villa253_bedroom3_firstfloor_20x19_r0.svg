<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5B89B4" />
      <stop offset="65%" stop-color="#C8DFEE" />
      <stop offset="100%" stop-color="#7FA36B" />
    </linearGradient>
    <linearGradient id="oakFloor3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9E7B56" />
      <stop offset="100%" stop-color="#6E5134" />
    </linearGradient>
    <radialGradient id="cove3" cx="50%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#FFE29E" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#FFE29E" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- First Floor Penthouse Bedroom 3: 20'-8" x 19'-0" (393 sq.ft) -->
  <rect width="1600" height="900" fill="#F4EFE7" />

  <!-- Ceiling & 2700K Cove -->
  <polygon points="0,0 1600,0 1360,150 240,150" fill="#FAF8F5" />
  <polygon points="240,150 1360,150 1340,165 260,165" fill="#FFDA85" />
  <rect width="1600" height="380" fill="url(#cove3)" />

  <!-- North Sliding Glass Portal SD1A (12'-0" x Beam) opening to 24'-4" x 4'-0" Balcony -->
  <rect x="240" y="150" width="760" height="490" fill="url(#sky3)" stroke="#22252A" stroke-width="10" />
  <!-- Balcony Glass Balustrade & Decking -->
  <rect x="248" y="545" width="744" height="90" fill="#A7D8F0" fill-opacity="0.35" stroke="#E2E8F0" stroke-width="2" />
  <line x1="620" y1="150" x2="620" y2="640" stroke="#22252A" stroke-width="8" />

  <!-- Right Feature Wall (Fluted White Oak & King Headboard) -->
  <polygon points="1000,150 1360,150 1600,0 1600,900 1360,640 1000,640" fill="#8C6543" />
  <g stroke="#593D25" stroke-width="3" opacity="0.45">
    <line x1="1040" y1="150" x2="1040" y2="640" />
    <line x1="1080" y1="150" x2="1080" y2="640" />
    <line x1="1120" y1="150" x2="1120" y2="640" />
    <line x1="1160" y1="150" x2="1160" y2="640" />
    <line x1="1200" y1="150" x2="1200" y2="640" />
    <line x1="1240" y1="150" x2="1240" y2="640" />
    <line x1="1280" y1="150" x2="1280" y2="640" />
    <line x1="1320" y1="150" x2="1320" y2="640" />
  </g>

  <!-- Left Wall with SD2A (10'-0" Side Terrace Slider) -->
  <polygon points="0,0 240,150 240,640 0,900" fill="#EAE3D5" />
  <polygon points="40,180 210,205 210,620 40,760" fill="url(#sky3)" stroke="#22252A" stroke-width="8" />

  <!-- Smoked Oak Herringbone Floor -->
  <polygon points="0,900 240,640 1360,640 1600,900" fill="url(#oakFloor3)" />

  <!-- King Platform Bed & Upholstered Bouclé Headboard -->
  <ellipse cx="980" cy="805" rx="340" ry="42" fill="#000000" opacity="0.35" />
  <rect x="860" y="485" width="420" height="145" rx="14" fill="#E8E0D4" stroke="#C8BCAE" stroke-width="3" />
  <polygon points="650,780 900,620 1320,620 1180,780" fill="#FAF7F2" stroke="#D8CFC2" stroke-width="2" />
  <polygon points="650,780 1180,780 1180,835 650,835" fill="#5A3E28" />
  <!-- Pillows & Throw Blanket -->
  <rect x="915" y="585" width="140" height="48" rx="10" fill="#FFFFFF" stroke="#D0C7B8" />
  <rect x="1085" y="585" width="140" height="48" rx="10" fill="#FFFFFF" stroke="#D0C7B8" />
  <polygon points="670,730 1210,730 1180,780 650,780" fill="#9C7A54" />

  <!-- Architectural Verification Stamp -->
  <g transform="translate(36, 36)" font-family="monospace">
    <rect width="590" height="94" rx="10" fill="#0F172A" fill-opacity="0.9" stroke="#38BDF8" stroke-width="1.5" />
    <text x="20" y="28" fill="#38BDF8" font-size="13" font-weight="bold">VILLA 253 • FIRST FLOOR BEDROOM 3 &amp; WRAP-AROUND BALCONIES</text>
    <text x="20" y="50" fill="#FFFFFF" font-size="14" font-weight="bold">EXACT DIMENSIONS: 20'-8" × 19'-0" (393 SQ.FT) • REV 0</text>
    <text x="20" y="70" fill="#34D399" font-size="11">Balconies: 24'-4" × 4'-0" North (SD1A 12') &amp; 14'-10" × 4'-0" Side (SD2A 10')</text>
    <text x="20" y="85" fill="#94A3B8" font-size="10">Ensuite Toilet 3: 9'-9" × 9'-2" (D2A, W3A) • Entry Door D1A (4'-0")</text>
  </g>
</svg>
